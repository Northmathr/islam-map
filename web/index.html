<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosques in the United Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // set the theme before first paint so there is no flash of the wrong palette
  document.documentElement.dataset.theme =
    localStorage.getItem("theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

  // Asset version. netlify.toml substitutes the commit SHA at deploy time, so
  // browsers never mix old and new files. Left unsubstituted it is local dev,
  // where a constant URL means an edit is invisible until the cache expires --
  // so fall back to a per-load value there.
  window.__ASSETS__ = "__BUILD__";
  if (window.__ASSETS__ === "__" + "BUILD__") window.__ASSETS__ = Date.now();
  document.write(
    '<link rel="stylesheet" href="style.css?v=' + window.__ASSETS__ + '">');
</script>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <h1>Mosques in the United Kingdom</h1>
    <p class="sub">Where they are, how the number has changed, and what is in planning</p>
  </div>
  <button id="theme" aria-label="Switch between light and dark"><span></span></button>
</header>

<section id="stats"></section>

<main>
  <div id="stage">
    <div id="maptools">
      <label class="ctl">
        <span>Colour the map by</span>
        <select id="metric"></select>
      </label>
      <div class="ctl">
        <span>Show on the map</span>
        <div class="chips" id="overlays"></div>
      </div>
    </div>

    <div id="mapwrap">
      <canvas id="dots"></canvas>
      <svg id="map"></svg>
      <div id="legend"></div>
      <div id="zoomctl">
        <button data-z="1.6" aria-label="Zoom in">+</button>
        <button data-z="0.625" aria-label="Zoom out">−</button>
        <button data-z="reset" aria-label="Reset view">⟲</button>
      </div>
    </div>

    <div id="timebar">
      <button id="play" aria-label="Play through the years">▶</button>
      <div class="track-wrap">
        <input type="range" id="year" step="1">
        <div id="ticks"></div>
      </div>
      <output id="yearlabel"></output>
    </div>
    <p class="method" id="method"></p>
  </div>

  <aside id="panel" class="empty">
    <div id="panel-body"></div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>document.write('<script src="app.js?v=' + window.__ASSETS__ + '"><\/script>');</script>
</body>
</html>
